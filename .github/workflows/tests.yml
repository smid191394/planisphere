name: tests

# What runs here is every suite that needs only a toolchain. The layout suite,
# the artifact contract and the end-to-end run are not here: the first two read
# the fixture corpus, which is clones of real projects kept outside the
# repository, and the third installs the packaged extension into a real VS Code.
# They are run before a release, by hand — see docs/release-checklist.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run compile

      - name: the extension host
        run: node --test out/tests/
      - name: the CLI
        run: node --test bin/tests/
      - name: the TypeScript analyzer
        run: node --test analyzers/typescript/tests/
      - name: the Python analyzer
        run: PYTHONPATH=analyzers/python python3 -m unittest discover -s analyzers/python/tests
      - name: the Go analyzer
        run: cd analyzers/go && GOTOOLCHAIN=local GOWORK=off go test ./...
      - name: the Rust analyzer
        run: cd analyzers/rust && cargo test --locked
      - name: the Java analyzer
        run: java analyzers/java/tests/Tests.java
